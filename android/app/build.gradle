apply plugin: 'com.android.application'

def uploadKeystorePath = System.getenv('HEARTH_UPLOAD_KEYSTORE')
def uploadKeyAlias = System.getenv('HEARTH_UPLOAD_KEY_ALIAS')
def uploadStorePassword = System.getenv('HEARTH_UPLOAD_STORE_PASSWORD')
def uploadKeyPassword = System.getenv('HEARTH_UPLOAD_KEY_PASSWORD')
def hasUploadSigning = [uploadKeystorePath, uploadKeyAlias, uploadStorePassword, uploadKeyPassword]
    .every { it != null && !it.trim().isEmpty() }

android {
    namespace = "com.hearth.expenses"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hearth.expenses"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        playUpload {
            if (hasUploadSigning) {
                storeFile = new File(uploadKeystorePath)
                storePassword = uploadStorePassword
                keyAlias = uploadKeyAlias
                keyPassword = uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.playUpload
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.configureEach { task ->
    if (task.name in ['bundleRelease', 'assembleRelease', 'signReleaseBundle', 'validateSigningRelease', 'packageRelease']) {
        task.doFirst {
            def required = [
                'HEARTH_UPLOAD_KEYSTORE': uploadKeystorePath,
                'HEARTH_UPLOAD_KEY_ALIAS': uploadKeyAlias,
                'HEARTH_UPLOAD_STORE_PASSWORD': uploadStorePassword,
                'HEARTH_UPLOAD_KEY_PASSWORD': uploadKeyPassword
            ]
            def missing = required.findAll { name, value -> value == null || value.trim().isEmpty() }.keySet()
            if (!missing.isEmpty()) {
                throw new GradleException("Release signing is not configured. Set: ${missing.join(', ')}.")
            }
            if (!new File(uploadKeystorePath).isAbsolute()) {
                throw new GradleException('HEARTH_UPLOAD_KEYSTORE must be an absolute path to the local upload keystore.')
            }
            if (!new File(uploadKeystorePath).isFile()) {
                throw new GradleException('The file set in HEARTH_UPLOAD_KEYSTORE does not exist.')
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
